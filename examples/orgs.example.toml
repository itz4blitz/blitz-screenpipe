# Copy to ~/.config/screenpipe/orgs.toml
# [inbox] is the only live recorder. [orgs.*] are file-later destinations.

[inbox]
label = "Inbox"
short = "In"
port = 3030
data_dir = "~/.local/share/screenpipe/inbox"
unit = "screenpipe-inbox.service"

[orgs.work]
label = "Work"
short = "Wrk"
data_dir = "~/.local/share/screenpipe/work"
agent_share = false

[orgs.client]
label = "Client"
short = "Cli"
data_dir = "~/.local/share/screenpipe/client"
agent_share = true

[orgs.personal]
label = "Personal"
short = "Me"
data_dir = "~/.local/share/screenpipe/personal"
agent_share = false
